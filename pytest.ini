[pytest]
# Tests import the package as `lifeengine`, which resolves through a `lifeengine`
# -> hermes-life-engine symlink in the repo's PARENT dir. Run from there:
#
#   cd <parent-of-repo>
#   PYTHONPATH="$PWD" hermes-life-engine/.venv/bin/python -m pytest lifeengine/tests
#
# Fast inner loop (~9s with -n auto): the command above. The heavy
# export/import/upgrade smoke tests are marked @pytest.mark.slow and skipped by
# default (see tests/conftest.py) — they each take ~160s and otherwise dominate
# the sweep.
#   Parallelise:   append  -n auto      (needs pytest-xdist, requirements-dev.txt)
#   Full gate:     append  --run-slow -n auto     (~3min; CI runs this)
testpaths = tests
