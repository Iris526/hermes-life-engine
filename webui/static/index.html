<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>归明观 · Observatory</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app">
  <!-- Loading -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-circle"></div>
    <p>归明观载入中…</p>
  </div>

  <!-- Main Layout (hidden until loaded) -->
  <div id="main-layout" class="main-layout hidden">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="bar-left">
        <span class="logo">归明观</span>
        <span class="logo-sub">Observatory</span>
      </div>
      <div class="bar-center">
        <span id="avatar-label" class="status-tag">—</span>
        <span id="avatar-bubble" class="speech-bubble hidden"></span>
      </div>
      <div class="bar-right">
        <button id="btn-refresh" class="icon-btn" title="刷新">↻</button>
        <button id="btn-tick" class="icon-btn" title="推进">▶</button>
      </div>
    </header>

    <div class="body-area">
      <!-- Left Sidebar -->
      <aside class="sidebar">
        <div class="char-panel">
          <div class="sprite-frame" id="sprite-frame">
            <img id="sprite-img" src="/static/assets/sprite-idle.png" alt="sprite">
          </div>
          <div class="char-info">
            <h2 id="char-name">Iris · 明灯</h2>
            <p id="char-title" class="char-title">赛博驱鬼小道士</p>
          </div>
        </div>

        <div class="resource-bars" id="resource-bars">
          <!-- JS injects bars here -->
        </div>

        <div class="quick-stats" id="quick-stats">
          <!-- JS injects stats here -->
        </div>
      </aside>

      <!-- Content Area -->
      <main class="content-area">
        <nav class="tab-bar">
          <button class="tab active" data-tab="overview">总览</button>
          <button class="tab" data-tab="wardrobe">装扮</button>
          <button class="tab" data-tab="schedule">日程</button>
          <button class="tab" data-tab="dreams">梦境</button>
          <button class="tab" data-tab="log">日志</button>
        </nav>

        <div class="tab-content">
          <!-- Overview -->
          <section id="tab-overview" class="tab-panel active">
            <div class="overview-grid">
              <div class="card" id="card-state">
                <h3>当前状态</h3>
                <div id="state-detail" class="state-detail"></div>
              </div>
              <div class="card" id="card-goal">
                <h3>当前目标</h3>
                <div id="goal-detail"></div>
              </div>
              <div class="card" id="card-schedule-today">
                <h3>今日日程</h3>
                <div id="schedule-today-list"></div>
              </div>
              <div class="card" id="card-recent-events">
                <h3>近期事件</h3>
                <div id="recent-events-list" class="event-list"></div>
              </div>
              <div class="card" id="card-review">
                <h3>待处理事项</h3>
                <div id="review-list"></div>
              </div>
              <div class="card" id="card-doctor">
                <h3>健康检查</h3>
                <div id="doctor-detail"></div>
              </div>
            </div>
          </section>

          <!-- Wardrobe / Collections -->
          <section id="tab-wardrobe" class="tab-panel hidden">
            <div class="wardrobe-tabs" id="wardrobe-tabs">
              <!-- JS injects collection tabs -->
            </div>
            <div class="wardrobe-grid" id="wardrobe-grid">
              <!-- JS injects item cards -->
            </div>
          </section>

          <!-- Item Detail Modal -->
          <div id="item-modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
            <div class="modal-content item-modal-content">
              <button class="modal-close" onclick="closeModal()">✕</button>
              <div id="item-modal-body"></div>
            </div>
          </div>

          <!-- Schedule -->
          <section id="tab-schedule" class="tab-panel hidden">
            <div class="schedule-header">
              <h3 id="schedule-label">日程时间线</h3>
            </div>
            <div class="timeline" id="schedule-timeline"></div>
          </section>

          <!-- Dreams -->
          <section id="tab-dreams" class="tab-panel hidden">
            <div id="dreams-list" class="dreams-list"></div>
          </section>

          <!-- Log / Trace -->
          <section id="tab-log" class="tab-panel hidden">
            <div id="trace-list" class="trace-list"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
